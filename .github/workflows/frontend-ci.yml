name: Frontend CI

on:
  push:
    paths:
      - 'bgg-shop-frontend/**'
  pull_request:
    paths:
      - 'bgg-shop-frontend/**'

jobs:
  test:
    name: Run frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests (Vitest)
        run: npx vitest run --globals --environment jsdom

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: bgg-shop-frontend/results
