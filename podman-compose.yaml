version: '3.8'

# Ancla de YAML con variables para Saleor y Flask
x-saleor-environment: &saleor-environment
  CELERY_BROKER_URL: "redis://redis:6379/1"
  REDIS_URL: "redis://redis:6379/0"
  ALLOWED_HOSTS: "localhost,127.0.0.1,api,bff,frontend"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000"
  DEBUG: "True"
  # Local default is Mailpit. An external SMTP host needs the explicit opt-in below,
  # TLS/SSL and a real sender; set them in your shell, never in this file.
  EMAIL_URL: "smtp://mailpit:1025"
  EMAIL_HOST: ${EMAIL_HOST:-mailpit}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  MEEPLE_APP_SMTP_PASSWORD: ${MEEPLE_APP_SMTP_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
  EMAIL_EXTERNAL_SMTP_ENABLED: ${EMAIL_EXTERNAL_SMTP_ENABLED:-false}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@saleor.local}
  EMAIL_VERIFICATION_FRONTEND_ORIGIN: ${EMAIL_VERIFICATION_FRONTEND_ORIGIN:-http://localhost:3000}
  MEDIA_ROOT: "/app/media"
  # OpKeys feature flags and internal secret for service-to-service calls
  OPKEYS_ISSUE_ON_LOGIN: ${OPKEYS_ISSUE_ON_LOGIN:-false}
  OPKEY_INTERNAL_SECRET: ${OPKEY_INTERNAL_SECRET:-}
  CHAT_ASSERTION_SECRET: ${CHAT_ASSERTION_SECRET:-}

services:
  # 1. Base de Datos Transaccional (OLTP - PostgreSQL 15)
  db:
    image: docker.io/library/postgres:15-alpine
    container_name: ${CONTAINER_NAME:-saleor_db}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saleor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saleor_pass}
      POSTGRES_DB: ${POSTGRES_DB:-saleor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saleor} -d ${POSTGRES_DB:-saleor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. In-Memory Data Store (Broker & Cache)
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: saleor_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Servidor SMTP de desarrollo
  mailpit:
    image: docker.io/axllent/mailpit
    container_name: saleor_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  # 4. Backend Saleor API (Django GraphQL Engine - Interno)
  api:
    build:
      context: ./bgg-shop-core
      dockerfile: Dockerfile
    container_name: saleor_api
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .local/parallel-db/database.env
      - .local/parallel-db/auth.env
    environment:
      <<: *saleor-environment
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_SANDBOX: ${MP_SANDBOX:-false}
      COUNTRY_MONEY_CODE: ${COUNTRY_MONEY_CODE:-AR}
      MP_CURRENCY_ID: ${MP_CURRENCY_ID:-}
      FRONTEND_URL: "http://localhost:3000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./bgg-shop-core:/app:z
      - saleor_media:/app/media:z
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - parallel-database
    restart: unless-stopped

  opkey-audit-retention:
    image: ${OPKEY_RETENTION_IMAGE:-localhost/boardgame-app_api:latest}
    container_name: saleor_opkey_retention
    profiles: ["opkey-audit"]
    command: python manage.py run_opkey_audit_retention
    env_file:
      - .local/parallel-db/database.env
      - .local/parallel-db/auth.env
    environment:
      DEBUG: "True"
    volumes:
      - ./bgg-shop-core:/app:z
    restart: unless-stopped
    networks:
      - default
      - parallel-database

  # 5. 🟢 Microservicio Flask (BFF / Proxy REST / RBAC)
  bff:
    build:
      context: ./bgg-shop-bff
      dockerfile: Dockerfile
    container_name: saleor_bff
    env_file:
      - .local/parallel-db/auth.env
    environment:
      PORT: "5000"
      FLASK_ENV: "development"
      # Comunicación interna entre contenedores por DNS de Podman
      SALEOR_GRAPHQL_URL: "http://api:8000/graphql/"
      # Base URL para llamadas internas (usado por opkey_middleware)
      SALEOR_BASE_URL: "http://api:8000"
      OPKEY_INTERNAL_SECRET: ${OPKEY_INTERNAL_SECRET:-}
      CHAT_ASSERTION_SECRET: ${CHAT_ASSERTION_SECRET:-}
      CHAT_REDIS_URL: "redis://redis:6379/2"
      CHAT_OLLAMA_BASE_URL: "http://ollama:11434"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      CHAT_EMBEDDING_MODEL: ${CHAT_EMBEDDING_MODEL:-embeddinggemma}
      CHAT_CHROMA_DIR: "/app/.local/approved-faq-chroma"
    ports:
      - "5000:5000"
    volumes:
      - ./bgg-shop-bff:/app:z
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - default
      - chat-models
    restart: unless-stopped

  ollama:
    image: docker.io/ollama/ollama
    container_name: saleor_ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - chat-models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 6. Worker Asíncrono + Scheduler (Celery)
  celery:
    build:
      context: ./bgg-shop-core
      dockerfile: Dockerfile
    container_name: saleor_celery
    command: python -m celery -A saleor worker --beat --loglevel=info
    env_file:
      - .local/parallel-db/database.env
      - .local/parallel-db/auth.env
    environment:
      <<: *saleor-environment
    volumes:
      - ./bgg-shop-core:/app:z
      - saleor_media:/app/media:z
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - parallel-database
    restart: unless-stopped

  # 7. Frontend Storefront (React / Vite)
  frontend:
    build:
      context: ./bgg-shop-frontend
      dockerfile: Dockerfile
    container_name: saleor_frontend
    environment:
      # React consume ÚNICAMENTE la API REST expuesta por Flask
      VITE_API_BASE_URL: "http://localhost:5000/api/v1"
      VITE_USE_OPKEY: ${VITE_USE_OPKEY:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./bgg-shop-frontend:/app:z
      - frontend_node_modules:/app/node_modules
    depends_on:
      - bff
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  saleor_media:
    driver: local
  frontend_node_modules:
    driver: local
  ollama_models:
    driver: local

networks:
  default:
    name: saleor_network
  chat-models:
    name: saleor_chat_models
  parallel-database:
    name: bgg_shop_parallel_internal
    external: true