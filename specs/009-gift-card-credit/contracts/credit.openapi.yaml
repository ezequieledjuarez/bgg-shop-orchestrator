openapi: 3.2.0
info:
  title: Gift Card Credit API Draft
  version: 0.1.0
  description: >-
    Proposed buyer operations. Existing Mercado Pago checkout is unchanged.
    Monetary balance fields are decimal strings in ARS. All responses must use
    Cache-Control no-store. Gift card codes and authorization headers must not
    be logged, included in URLs, or returned in errors.
paths:
  /api/v1/credit:
    get:
      operationId: getCreditBalance
      summary: Read the authenticated buyer's available credit
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current balance, or zero if the buyer has never redeemed a card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /api/v1/gift-cards/redeem:
    post:
      operationId: redeemGiftCard
      summary: Redeem one gift card into the authenticated buyer's credit
      description: >-
        A successful redemption consumes the card and credits its full value
        atomically. A code already redeemed under a different request is rejected
        without revealing its owner or state.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  writeOnly: true
      responses:
        '200':
          description: Resulting balance at the time of redemption.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: The card cannot be redeemed; the response must not reveal why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          $ref: '#/components/responses/Unavailable'
  /api/v1/checkout/credit:
    post:
      operationId: checkoutWithCredit
      summary: Create and pay for an order using account credit
      description: >-
        The server calculates the total. Order, debit, stock, invoice, and purchased
        cart quantities change atomically. Insufficient credit or stock creates no
        order and causes no debit. No Mercado Pago request is made.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../bgg-shop-bff/specs/openapi.yaml#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Paid order and remaining balance at the time of purchase.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [order, credit]
                properties:
                  order:
                    $ref: '../../../bgg-shop-bff/specs/openapi.yaml#/components/schemas/PurchaseOrder'
                  credit:
                    $ref: '#/components/schemas/CreditBalance'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Insufficient stock, insufficient credit, or conflicting idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '422':
          description: The cart is empty or the order cannot be paid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID scoped to the authenticated buyer and operation.
        Repeat the same key and request after an uncertain outcome; a completed
        retry returns the original result snapshot without applying effects again.
        Reuse with a different request returns 409. Never persist a raw card code.
      schema:
        type: string
        format: uuid
  schemas:
    CreditBalance:
      type: object
      additionalProperties: false
      required: [balance, currency]
      properties:
        balance:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          examples: ['20000.00']
        currency:
          type: string
          const: ARS
    OrderErrorResponse:
      $ref: '../../../bgg-shop-bff/specs/openapi.yaml#/components/schemas/OrderErrorResponse'
  responses:
    InvalidRequest:
      description: Invalid request body or idempotency key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderErrorResponse'
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderErrorResponse'
    IdempotencyConflict:
      description: The key was previously used for a different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderErrorResponse'
    Unavailable:
      description: Core is unavailable or returned an invalid response; retry with the same key.